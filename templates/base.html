{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog{% endblock %}</title>
    <style>
        * 
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body 
        {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        header 
        {
            background-color: #333;
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        header h1 
        {
            margin: 0;
        }
        
        nav 
        {
            margin-top: 10px;
        }
        
        nav a 
        {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-size: 16px;
        }
        
        nav a:hover 
        {
            text-decoration: underline;
        }
        
        main 
        {
            flex: 1;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        footer 
        {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }

        footer p 
        {
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/">Ana Sehife</a>
            <a href="/posts/">Postlar</a>
            <a href="/categories/">Kateqoriyalar</a>
            <a href="/about/">Haqqımızda</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 STEP IT Blog</p>
    </footer>
</body>
</html>
