<div class="post-card">
    <h2>
        {% if post.is_featured %}★ {% endif %}{{ post.title }}
    </h2>
    <p class="post-meta">
        Müellif: <a href="{% url 'author_posts' post.author %}">@{{ post.author }}</a> | 
        Kateqoriya: {{ post.category }} | 
        Tarix: {{ post.created_at }} |
        Baxış: {{ post.views }}
    </p>
    <p>{{ post.content }}</p>
    <a href="{% url 'post_detail' post.id %}">Daha oxu</a>
</div>
