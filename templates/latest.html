{% extends "base.html" %}
{% block title %}Son Postlar{% endblock %}
{% block content %}
    <h1>Son Postlar</h1>
    <table border="1" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th>#</th>
                <th>Başlıq</th>
                <th>Tarix</th>
                <th>Müellif</th>
            </tr>
        </thead>
        <tbody>
            {% for post in posts %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td><a href="{% url 'post_detail' post.id %}">{{ post.title }}</a></td>
                    <td>{{ post.created_at }}</td>
                    <td>{{ post.author }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">Postu yoxdur</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
